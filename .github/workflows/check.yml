name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bluenote-webui
        uses: actions/checkout@v4
        with:
          path: bluenote-webui

      - name: Check out bluenote-core sibling
        uses: actions/checkout@v4
        with:
          repository: LordierClaw/bluenote-core
          ref: feat/node-16-14-compat
          path: bluenote-core

      - name: Set up Node 16.14
        uses: actions/setup-node@v4
        with:
          node-version: 16.14.2
          cache: npm
          cache-dependency-path: |
            bluenote-webui/package-lock.json
            bluenote-core/package-lock.json

      - name: Build bluenote-core
        working-directory: bluenote-core
        run: |
          npm ci --include=dev
          npm run build

      - name: Install web UI dependencies
        working-directory: bluenote-webui
        run: npm ci --include=dev

      - name: Run web UI check
        working-directory: bluenote-webui
        run: npm run check
